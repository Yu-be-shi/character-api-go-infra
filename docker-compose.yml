# ローカル・CI 用: API 単体起動
#
# 前提:
#   1. character-db-infra/ で docker compose up -d を先に実行しておくこと
#      (character-db-net ネットワークと DB が起動済みであること)
#   2. 以下のレイアウトでリポジトリが配置されていること
#      character-system/
#      ├── apis/character-api-go/
#      └── apis/character-api-go-infra/ (このファイル)
#
# 起動: docker compose up --build -d

services:
  character-api:
    build:
      context: ../character-api-go
      dockerfile: Dockerfile
      target: runtime
    environment:
      DB_DSN: "host=character-db user=${CHAR_DB_USER:-app} password=${CHAR_DB_PASSWORD:-devpassword} dbname=${CHAR_DB_NAME:-characters} port=5432 sslmode=disable TimeZone=UTC"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-api-key}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # 冪等性キー用 Redis（このサービス専有）。未設定なら冪等性機能は無効。
      REDIS_ADDR: ${REDIS_ADDR:-character-api-redis:6379}
      # 予約パターンの TTL 回収: 確定(confirm)されなかった作成(pending)を回収する。
      # 既定は config の envDefault（1h / 10m）。SWEEP_INTERVAL=0 でスイーパー無効。
      RESERVATION_TTL: ${RESERVATION_TTL:-1h}
      RESERVATION_SWEEP_INTERVAL: ${RESERVATION_SWEEP_INTERVAL:-10m}
    # デバッグ用のホスト公開はループバックに限定する（STG の自宅サーバー等で
    # LAN/外部にポートを晒さない。アプリは character-db-net 経由で到達する）。
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      character-api-redis:
        condition: service_healthy
    networks:
      - character-db-net

  # character-api 専有の Redis（冪等キーの重複排除ストア）。
  # 共有 DB(character-db) とは別物で、このサービスだけが使う private ストア。
  character-api-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - character-db-net

networks:
  character-db-net:
    external: true
    name: character-db-net
